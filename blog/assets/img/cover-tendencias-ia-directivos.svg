<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Ilustración: seis pilares estratégicos de IA para directivos en 2026 — economía de inferencia, agentes autónomos, ciberseguridad algorítmica, productividad con gobernanza, cumplimiento extraterritorial y adopción en LatAm — conectados por una arquitectura de decisión central">
  <defs>
    <radialGradient id="bg" cx="50%" cy="8%" r="130%">
      <stop offset="0%" stop-color="#1f1f29"/>
      <stop offset="50%" stop-color="#0e0e11"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.6"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>

  <!-- Título superior -->
  <text x="600" y="60" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="8" fill="#ffffff" fill-opacity="0.28" text-anchor="middle">TENDENCIAS IA · DIRECTIVOS 2026</text>

  <!-- Nodo central: Decisión Ejecutiva -->
  <g filter="url(#glow)">
    <circle cx="600" cy="300" r="68" fill="#16161b" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3"/>
    <circle cx="600" cy="300" r="92" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="8 12"/>
    <text x="600" y="292" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="600" fill="#ffffff" fill-opacity="0.95" text-anchor="middle" letter-spacing="1.5">DECISIÓN</text>
    <text x="600" y="312" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="600" fill="#ffffff" fill-opacity="0.95" text-anchor="middle" letter-spacing="1.5">EJECUTIVA</text>
  </g>

  <!-- Pilar 1: Economía de Inferencia (arriba-izquierda) -->
  <g transform="translate(220, 120)">
    <circle cx="0" cy="0" r="54" fill="#16161b" stroke="#10b981" stroke-opacity="0.85" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="#10b981" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="6 10"/>
    <path d="M-18 -8 L0 10 L18 -8" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-22" y="18" width="44" height="6" rx="3" fill="#10b981" fill-opacity="0.9"/>
    <rect x="-22" y="28" width="30" height="6" rx="3" fill="#10b981" fill-opacity="0.5"/>
    <text x="0" y="88" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ffffff" fill-opacity="0.9" text-anchor="middle">ECONOMÍA</text>
    <text x="0" y="102" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#10b981" fill-opacity="0.9" text-anchor="middle">INFERENCIA</text>
    <text x="0" y="116" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">90–94% ahorro</text>
  </g>
  <path d="M 265 165 C 330 185, 400 220, 480 260" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pilar 2: Agentes Autónomos (arriba-derecha) -->
  <g transform="translate(980, 120)">
    <circle cx="0" cy="0" r="54" fill="#16161b" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="6 10"/>
    <circle cx="-10" cy="-8" r="6" fill="#ffffff" fill-opacity="0.9"/>
    <circle cx="10" cy="-8" r="6" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M-14 8 Q 0 14 14 8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>
    <circle cx="-20" cy="22" r="4" fill="#ffffff" fill-opacity="0.4"/>
    <circle cx="0" cy="26" r="4" fill="#ffffff" fill-opacity="0.6"/>
    <circle cx="20" cy="22" r="4" fill="#ffffff" fill-opacity="0.4"/>
    <text x="0" y="88" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ffffff" fill-opacity="0.9" text-anchor="middle">AGENTES</text>
    <text x="0" y="102" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ffffff" fill-opacity="0.9" text-anchor="middle">AUTÓNOMOS</text>
    <text x="0" y="116" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">OpenClaw / Hermes</text>
  </g>
  <path d="M 935 165 C 870 185, 800 220, 720 260" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pilar 3: Ciberseguridad Algorítmica (medio-izquierda) -->
  <g transform="translate(150, 300)">
    <circle cx="0" cy="0" r="54" fill="#16161b" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="6 10"/>
    <rect x="-18" y="-16" width="36" height="36" rx="4" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2.5"/>
    <path d="M-8 -6 L8 6 M8 -6 L-8 6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85"/>
    <rect x="-26" y="24" width="52" height="4" rx="2" fill="#ffffff" fill-opacity="0.15"/>
    <rect x="-26" y="24" width="18" height="4" rx="2" fill="#ffffff" fill-opacity="0.9"/>
    <text x="0" y="88" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ffffff" fill-opacity="0.9" text-anchor="middle">CIBERSEGURIDAD</text>
    <text x="0" y="102" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ffffff" fill-opacity="0.9" text-anchor="middle">ALGORÍTMICA</text>
    <text x="0" y="116" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">Unit 42: &lt;10h</text>
  </g>
  <path d="M 190 300 C 260 300, 380 300, 480 300" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pilar 4: Productividad con Gobernanza (medio-derecha) -->
  <g transform="translate(1050, 300)">
    <circle cx="0" cy="0" r="54" fill="#16161b" stroke="#10b981" stroke-opacity="0.85" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="#10b981" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="6 10"/>
    <path d="M-16 -12 L16 12 M-16 12 L16 -12" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="0" y="88" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ffffff" fill-opacity="0.9" text-anchor="middle">PRODUCTIVIDAD</text>
    <text x="0" y="102" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#10b981" fill-opacity="0.9" text-anchor="middle">CON GOBERNANZA</text>
    <text x="0" y="116" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">26% vs 3% éxito</text>
  </g>
  <path d="M 1010 300 C 940 300, 820 300, 720 300" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pilar 5: Cumplimiento Extraterritorial (abajo-izquierda) -->
  <g transform="translate(220, 480)">
    <circle cx="0" cy="0" r="54" fill="#16161b" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="6 10"/>
    <path d="M0 -18 L0 18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>
    <path d="M-18 0 L18 0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>
    <path d="M-12 -12 L-12 12 M12 -12 L12 12" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4"/>
    <text x="0" y="88" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ffffff" fill-opacity="0.9" text-anchor="middle">CUMPLIMIENTO</text>
    <text x="0" y="102" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ffffff" fill-opacity="0.9" text-anchor="middle">EXTRATERRITORIAL</text>
    <text x="0" y="116" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">AI Act · ISO 42001</text>
  </g>
  <path d="M 265 435 C 330 415, 400 380, 480 340" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pilar 6: Adopción LatAm / Shadow AI (abajo-derecha) -->
  <g transform="translate(980, 480)">
    <circle cx="0" cy="0" r="54" fill="#16161b" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="6 10"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 6"/>
    <path d="M-22 0 L22 0" stroke="#ffffff" stroke-width="2" stroke-opacity="0.7" stroke-linecap="round" stroke-dasharray="4 4"/>
    <circle cx="-15" cy="-10" r="3" fill="#ffffff" fill-opacity="0.4"/>
    <circle cx="15" cy="-10" r="3" fill="#ffffff" fill-opacity="0.4"/>
    <circle cx="-15" cy="10" r="3" fill="#ffffff" fill-opacity="0.4"/>
    <circle cx="15" cy="10" r="3" fill="#ffffff" fill-opacity="0.4"/>
    <text x="0" y="88" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ffffff" fill-opacity="0.9" text-anchor="middle">ADOPCIÓN</text>
    <text x="0" y="102" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ffffff" fill-opacity="0.9" text-anchor="middle">LATAM / SHADOW AI</text>
    <text x="0" y="116" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">79% bloqueos · 65% sombra</text>
  </g>
  <path d="M 935 435 C 870 415, 800 380, 720 340" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Footer con branding -->
  <text x="600" y="570" font-family="ui-monospace, Menlo, monospace" font-size="20" letter-spacing="6" fill="#ffffff" fill-opacity="0.25" text-anchor="middle">RICARDOTORALES.COM</text>
</svg>