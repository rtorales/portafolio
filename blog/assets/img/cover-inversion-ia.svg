<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Ilustración: el volumen creciente de capital invertido en inteligencia artificial">
  <defs>
    <radialGradient id="bg" cx="50%" cy="6%" r="120%">
      <stop offset="0%" stop-color="#26262f"/>
      <stop offset="55%" stop-color="#0e0e11"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <marker id="up" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.85"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>

  <!-- Columnas de capital: pilas de monedas que crecen -->
  <g>
    <!-- pila 1 -->
    <g fill="#ffffff" fill-opacity="0.16">
      <ellipse cx="320" cy="470" rx="52" ry="15"/>
      <rect x="268" y="440" width="104" height="30"/>
      <ellipse cx="320" cy="440" rx="52" ry="15"/>
    </g>
    <!-- pila 2 -->
    <g fill="#ffffff" fill-opacity="0.28">
      <ellipse cx="480" cy="470" rx="52" ry="15"/>
      <rect x="428" y="400" width="104" height="70"/>
      <ellipse cx="480" cy="400" rx="52" ry="15"/>
    </g>
    <!-- pila 3 -->
    <g fill="#ffffff" fill-opacity="0.45">
      <ellipse cx="640" cy="470" rx="52" ry="15"/>
      <rect x="588" y="330" width="104" height="140"/>
      <ellipse cx="640" cy="330" rx="52" ry="15"/>
    </g>
    <!-- pila 4, la dominante -->
    <g fill="#ffffff" fill-opacity="0.9">
      <ellipse cx="800" cy="470" rx="52" ry="15"/>
      <rect x="748" y="196" width="104" height="274"/>
      <ellipse cx="800" cy="196" rx="52" ry="15"/>
    </g>
  </g>

  <!-- Curva de aceleracion -->
  <path d="M300 452 C 430 442, 540 400, 634 330 S 760 236, 856 160"
        fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#up)"/>

  <!-- Simbolo de moneda en el nucleo -->
  <circle cx="800" cy="128" r="34" fill="#16161b" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3"/>
  <text x="800" y="142" font-family="ui-monospace, Menlo, monospace" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">$</text>

  <text x="72" y="530" font-family="ui-monospace, Menlo, monospace" font-size="21" letter-spacing="6" fill="#ffffff" fill-opacity="0.32">CAPITAL · IA · 2026</text>
</svg>
