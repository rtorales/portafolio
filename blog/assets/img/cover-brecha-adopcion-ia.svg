<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Ilustración: una escalera de cinco peldaños donde casi todos los puntos se concentran en el primero y muy pocos llegan a la cima">
  <defs>
    <radialGradient id="bg" cx="50%" cy="6%" r="120%">
      <stop offset="0%" stop-color="#26262f"/>
      <stop offset="55%" stop-color="#0e0e11"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <pattern id="crowd" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="4" fill="#ffffff" fill-opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>

  <!-- Escalera de profundidad: cinco peldaños -->
  <g fill="#ffffff">
    <rect x="240" y="440" width="150" height="40" fill-opacity="0.10"/>
    <rect x="390" y="380" width="150" height="100" fill-opacity="0.14"/>
    <rect x="540" y="320" width="150" height="160" fill-opacity="0.20"/>
    <rect x="690" y="260" width="150" height="220" fill-opacity="0.28"/>
    <rect x="840" y="200" width="150" height="280" fill-opacity="0.38"/>
  </g>
  <path d="M240 440 H390 V380 H540 V320 H690 V260 H840 V200 H990" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2.5"/>

  <!-- Multitud en el primer peldaño -->
  <rect x="246" y="368" width="138" height="72" fill="url(#crowd)"/>
  <!-- Menos en el segundo -->
  <g fill="#ffffff" fill-opacity="0.55">
    <circle cx="410" cy="368" r="4"/><circle cx="428" cy="368" r="4"/><circle cx="446" cy="368" r="4"/><circle cx="464" cy="368" r="4"/><circle cx="482" cy="368" r="4"/>
    <circle cx="419" cy="350" r="4"/><circle cx="437" cy="350" r="4"/><circle cx="455" cy="350" r="4"/>
  </g>
  <!-- Pocos en el tercero y cuarto -->
  <g fill="#ffffff" fill-opacity="0.7">
    <circle cx="580" cy="308" r="4.5"/><circle cx="600" cy="308" r="4.5"/><circle cx="620" cy="308" r="4.5"/>
    <circle cx="745" cy="248" r="5"/>
  </g>
  <!-- Uno en la cima -->
  <circle cx="915" cy="182" r="9" fill="#ffffff"/>
  <circle cx="915" cy="182" r="20" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Cifra -->
  <text x="915" y="130" font-family="ui-monospace, Menlo, monospace" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">2,2%</text>
  <text x="315" y="345" font-family="ui-monospace, Menlo, monospace" font-size="26" font-weight="700" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">49%</text>

  <text x="72" y="540" font-family="ui-monospace, Menlo, monospace" font-size="21" letter-spacing="6" fill="#ffffff" fill-opacity="0.32">ACCESO · PROFUNDIDAD · 2026</text>
</svg>
